name: Quizyu CI/CD Pipeline

# Trigger workflow setiap kali ada push atau Pull Request ke branch main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # =========================================================================
  # JOB 1: Continuous Integration untuk Flutter Frontend
  # =========================================================================
  flutter-ci:
    name: 📱 Flutter App CI (Analyze, Test, Build)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository kode
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Java (diperlukan untuk Gradle & Flutter Android Build)
      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 3: Setup Flutter SDK
      - name: 💙 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Install dependencies Flutter
      - name: 📦 Install Flutter Dependencies
        run: flutter pub get

      # Step 5: Analisis Kode Statis (Linter)
      - name: 🔍 Run Flutter Analyze
        run: flutter analyze

      # Step 6: Jalankan Automated Unit & Widget Tests
      - name: 🧪 Run Flutter Unit Tests
        run: flutter test

      # Step 7: Build APK Debug (Memastikan aplikasi siap di-build tanpa error)
      - name: 🛠️ Build Android Debug APK
        run: flutter build apk --debug

      # Step 8: Upload Artifact APK agar bisa di-download langsung dari GitHub Actions
      - name: 📤 Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: quizyu-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

  # =========================================================================
  # JOB 2: Continuous Integration untuk Node.js Express Backend
  # =========================================================================
  backend-ci:
    name: 🚀 Node.js Backend CI (Install & Check)
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository kode
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js Environment
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # Step 3: Install Node.js Dependencies di folder backend
      - name: 📦 Install Backend Dependencies
        working-directory: ./backend
        run: npm ci || npm install

      # Step 4: Cek Sintaksis Node.js
      - name: 🔍 Check Node.js Code Syntax
        working-directory: ./backend
        run: node -c index.js
